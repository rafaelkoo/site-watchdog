# Runs the watchdog every morning (and whenever the checker or the site list changes), saves the results in
# data/, and lets the checker open or close GitHub issues as alerts.
name: Website watchdog
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sites.json', 'watchdog.mjs', '.github/workflows/watch.yml']
permissions:
  contents: write
  issues: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright 1.50 supports 24.04; move both up together
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node watchdog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the results
        run: |
          git config user.name "site-watchdog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Watchdog results $(date -u +%Y-%m-%d)"
          git push
